name: Shell verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bash syntax
        run: |
          find bin -type f -print0 | xargs -0 -r bash -n
          bash -n config/env
          find config compat -name '*.sh' -print0 | xargs -0 -r bash -n
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils gcc-mingw-w64-x86-64 nodejs libjack-jackd2-dev libpipewire-0.3-dev
      - name: Check supported launcher scripts
        run: |
          shellcheck --severity=warning --exclude=SC1090,SC1091 \
            bin/waydaw bin/waydaw-desktop bin/install-waydaw-desktop bin/session bin/kill-session \
            bin/kill-system-session bin/ableton-proton-cleanup \
            bin/verify-proton-runner-mode config/prefix-safety.sh config/validated-runtime.sh config/session-lifecycle.sh config/bome.sh config/midi.sh config/authorization.sh \
            bin/midi-route-inspect bin/midi-route-example bin/apply-live-routes bin/clear-live-routes bin/bome-validation-check bin/bome-validation-route bin/launchpad-route-temp bin/launchpad-unroute-temp \
            bin/ableton bin/bome bin/ableton-proton-normalize-placement \
            config/ableton-runner.sh bin/ableton-kwin-decoration-controller \
            bin/check bin/check-system bin/ableton-wayland bin/session-status bin/wineasio-check \
            compat/ableton-sizing-shim/build.sh compat/waydaw-launch/build.sh compat/waydaw-recording/build.sh
      - name: Build the recording profile helper
        run: ./compat/waydaw-recording/build.sh
      - name: Verify isolated launch and recovery behavior
        run: ./bin/verify-proton-runner-mode
      - name: Verify KWin controller compatibility
        run: node tests/test_kwin_controller.cjs
      - name: Build independent audio diagnostics
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror validation/audio-monitor.c -ljack -lm -o /tmp/waydaw-audio-monitor
          cc -std=c11 -O2 -Wall -Wextra -Werror validation/audio-source.c -ljack -lm -o /tmp/waydaw-audio-source
          cc -std=c11 -O2 -Wall -Wextra -Werror validation/rt-budget-transition.c -o /tmp/waydaw-rt-budget-transition
          python3 -c 'from pathlib import Path; p = Path("validation/rt-budget-transition.py"); compile(p.read_text(), str(p), "exec")'
          x86_64-w64-mingw32-gcc -std=c17 -O2 -Wall -Wextra -Werror validation/wineasio/clock-host.c -lole32 -luuid -o /tmp/wineasio-clock-host.exe
      - name: Verify sizing shim builds reproducibly
        run: |
          ./compat/ableton-sizing-shim/build.sh
          sha256sum .local-tools/ableton-sizing-shim/version.dll > /tmp/shim.sha256
          ./compat/ableton-sizing-shim/build.sh
          sha256sum --check /tmp/shim.sha256
      - name: Verify Bome readiness helper builds reproducibly
        run: |
          ./compat/waydaw-launch/build.sh
          sha256sum .local-tools/waydaw-launch/wait-bome.exe > /tmp/launch-helper.sha256
          ./compat/waydaw-launch/build.sh
          sha256sum --check /tmp/launch-helper.sha256

